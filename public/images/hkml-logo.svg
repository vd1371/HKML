<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background for visibility on dark navbar -->
  <rect width="200" height="60" fill="transparent"/>

  <!-- HKML text using paths (no font dependencies) -->
  <g fill="url(#logoGrad)">
    <!-- H -->
    <rect x="20" y="15" width="8" height="30"/>
    <rect x="38" y="15" width="8" height="30"/>
    <rect x="20" y="27" width="26" height="6"/>

    <!-- K -->
    <rect x="60" y="15" width="8" height="30"/>
    <polygon points="68,30 82,15 90,15 90,21 76,34"/>
    <polygon points="76,34 90,45 90,39 82,30"/>

    <!-- M -->
    <rect x="105" y="15" width="8" height="30"/>
    <rect x="133" y="15" width="8" height="30"/>
    <polygon points="105,15 113,15 121,28 129,15 133,15 133,22 121,38"/>

    <!-- L -->
    <rect x="155" y="15" width="8" height="30"/>
    <rect x="155" y="39" width="25" height="6"/>
  </g>

  <!-- Small accent dots -->
  <circle cx="10" cy="30" r="3" fill="#00d4ff" opacity="0.8"/>
  <circle cx="190" cy="30" r="3" fill="#7c3aed" opacity="0.8"/>
</svg>
